name: Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      trigger_type:
        description: 'Type of trigger (pr or push)'
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.docker_image }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.X]
        architecture: [x64]
        ros_distribution:
          - humble
          - jazzy
          - kilted
          - lyrical
          - rolling
        exclude:
          - node-version: 24.X
            ros_distribution: rolling
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: ros:humble-ros-base-jammy
            ros_distribution: humble
          # Jazzy Jalisco (May 2024 - May 2029)
          - docker_image: ros:jazzy-ros-base-noble
            ros_distribution: jazzy
          # Kilted Kaiju (May 2025 - Dec 2026)
          - docker_image: ros:kilted-ros-base-noble
            ros_distribution: kilted
          # Lyrical Luth (May 2026 - May 2031)
          - docker_image: ros:lyrical-ros-base-resolute
            ros_distribution: lyrical
          # Use the same Rolling nightly release channel as Windows.
          - node-version: 26.X
            architecture: x64
            docker_image: ubuntu:resolute
            ros_distribution: rolling
            ros_tar_url: "https://github.com/ros2/ros2/releases/download/release-rolling-nightlies/ros2-rolling-nightly-linux-amd64.tar.bz2"
    steps:
    - name: Install Node.js runtime and lint dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends wget
        # Bare Ubuntu needs libatomic before setup-node starts Node 26.
        if [ "${{ matrix.ros_distribution }}" = "rolling" ]; then
          apt-get install -y --no-install-recommends libatomic1
        fi

    - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.architecture }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        architecture: ${{ matrix.architecture }}

    - uses: actions/checkout@v7

    - name: Setup Linux test environment
      uses: ./.github/actions/setup-ros2-apt
      with:
        ros-distribution: ${{ matrix.ros_distribution }}
        ros-tar-url: ${{ matrix.ros_tar_url }}

    # Retry transient test or download failures once. Keep max_attempts
    # conservative so persistent regressions still fail the matrix leg.
    - name: Build and test rclnodejs
      uses: nick-fields/retry@v4
      with:
        shell: bash
        max_attempts: 2
        retry_wait_seconds: 10
        timeout_minutes: 60
        command: |
          set -eo pipefail
          uname -a
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          npm i
          npm run lint
          # Run package validation, coverage, and documentation generation in
          # the Lyrical Node 24.X lane; only this lane uploads coverage below.
          if [ "${{ matrix.ros_distribution }}" = "lyrical" ] && [ "${{ matrix.node-version }}" = "24.X" ]; then
            npm run test:package
            npm run test:coverage
            npm run docs
          else
            npm test
          fi
          npm run clean

    - name: Coveralls
      if: ${{ matrix.ros_distribution == 'lyrical' && matrix['node-version'] == '24.X' }}
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
