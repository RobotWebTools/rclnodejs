name:  Linux arm64

on:
  push:
    branches:
      - develop
      - kilted
      - jazzy
      - humble-hawksbill
  pull_request:
    branches:
      - develop
      - kilted
      - jazzy
      - humble-hawksbill
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest-arm
    container:
      image: ${{ matrix.docker_image }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.X, 22.X, 24.X]
        architecture: [arm64]
        ros_distribution:
          - humble
          - jazzy
          - kilted
          - rolling
        include:
            # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: ubuntu:jammy
            ros_distribution: humble
          # Jazzy Jalisco (May 2024 - May 2029)
          - docker_image: ubuntu:noble
            ros_distribution: jazzy
          # Kilted Kaiju (May 2025 - Dec 2026)
          - docker_image: ubuntu:noble
            ros_distribution: kilted
          # Rolling Ridley (No End-Of-Life)
          - docker_image: ubuntu:noble
            ros_distribution: rolling
    steps:
    - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.architecture }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        architecture: ${{ matrix.architecture }}

    - name: Setup ROS2
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: ${{ matrix.ros_distribution }}

    - name: Install test-msgs on Linux
      run: |
        sudo apt install ros-${{ matrix.ros_distribution }}-test-msgs

    - uses: actions/checkout@v4

    - name: Build and test rclnodejs
      run: |
        uname -a
        source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
        npm i
        npm run lint
        npm test
        npm run clean

    - name: Coveralls Parallel
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        flag-name: run-${{ matrix.node-version }}-${{ matrix.architecture }}
        parallel: true

  finish:
      needs: build
      runs-on: ubuntu-latest
      steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
