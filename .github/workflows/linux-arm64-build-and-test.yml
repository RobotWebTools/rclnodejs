name: Linux ARM64 Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      trigger_type:
        description: 'Type of trigger (pr or push)'
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: ${{ matrix.docker_image }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64]
        ros_distribution:
          - humble
          - jazzy
          - kilted
          - lyrical
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - docker_image: ros:humble-ros-base-jammy
            ros_distribution: humble
            node-version: 20.X
          # Jazzy Jalisco (May 2024 - May 2029)
          - docker_image: ros:jazzy-ros-base-noble
            ros_distribution: jazzy
            node-version: 20.X
          # Kilted Kaiju (May 2025 - Dec 2026)
          - docker_image: ros:kilted-ros-base-noble
            ros_distribution: kilted
            node-version: 22.X
          # Lyrical Luth (May 2026 - May 2031)
          - docker_image: ros:lyrical-ros-base-resolute
            ros_distribution: lyrical
            node-version: 24.X
          - node-version: 26.X
            architecture: arm64
            docker_image: ubuntu:resolute
            ros_distribution: rolling
            ros_tar_url: "https://github.com/ros2/ros2/releases/download/release-rolling-nightlies/ros2-rolling-nightly-linux-arm64.tar.bz2"
            test_suite: idl

    steps:
    # Install runtime libraries before setup-node verifies the Node executable.
    - name: Install Node.js runtime dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends libatomic1

    - name: Setup Node.js ${{ matrix.node-version }} on ${{ matrix.architecture }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        architecture: ${{ matrix.architecture }}

    # npm 10 can crash while resolving tsdown's peer dependencies.
    - name: Setup npm 11.19.0
      run: npm install --global npm@11.19.0

    - uses: actions/checkout@v7

    - name: Enable ROS2 apt repository (rolling)
      if: ${{ matrix.ros_distribution == 'rolling' }}
      uses: ./.github/actions/setup-ros2-apt
      with:
        install-desktop: 'false'

    - name: Install ROS2 from binary tarball (rolling)
      if: ${{ matrix.ros_distribution == 'rolling' }}
      run: |
        apt-get install -y tar bzip2 python3-rosdep
        curl -fsSL "${{ matrix.ros_tar_url }}" -o /tmp/ros2-${{ matrix.ros_distribution }}.tar.bz2
        mkdir -p /opt/ros/${{ matrix.ros_distribution }}
        tar xf /tmp/ros2-${{ matrix.ros_distribution }}.tar.bz2 --strip-components=1 -C /opt/ros/${{ matrix.ros_distribution }}
        rm /tmp/ros2-${{ matrix.ros_distribution }}.tar.bz2
        rosdep init || true
        rosdep update
        rosdep install --rosdistro ${{ matrix.ros_distribution }} --from-paths /opt/ros/${{ matrix.ros_distribution }}/share --ignore-src -y --skip-keys "cyclonedds fastcdr fastdds iceoryx_binding_c rmw_connextdds rti-connext-dds-7.3.0 rti-connext-dds-7.7.0 urdfdom_headers python3-pyqt6.qtsvg rosidl_buffer_py pybind11"

    - name: Install build and test dependencies
      if: ${{ matrix.ros_distribution != 'rolling' }}
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          cmake sudo \
          ros-${{ matrix.ros_distribution }}-example-interfaces \
          ros-${{ matrix.ros_distribution }}-test-msgs \
          ros-${{ matrix.ros_distribution }}-mrpt-msgs

    - name: Install Electron test dependencies
      if: ${{ matrix.test_suite != 'idl' }}
      run: |
        # Adjust dependencies based on Ubuntu version
        LIBASOUND_PKG="libasound2"
        if grep -Eq "24\.04|26\.04" /etc/os-release; then
          LIBASOUND_PKG="libasound2t64"
        fi
        sudo apt install -y xvfb libgtk-3-0 libnss3 $LIBASOUND_PKG libgbm-dev

    - name: Fix permissions
      run: |
        # Fix ownership of the workspace to allow write access
        sudo chown -R $(whoami):$(whoami) $GITHUB_WORKSPACE

    # Wrap the test step in nick-fields/retry@v4 to absorb transient flakes
    # (mocha races, native rebuilds, Electron postinstall, network blips).
    # Keep max_attempts low so real regressions still surface quickly.
    - name: Build and test rclnodejs
      if: ${{ matrix.test_suite != 'idl' }}
      uses: nick-fields/retry@v4
      with:
        shell: bash
        max_attempts: 2
        retry_wait_seconds: 10
        timeout_minutes: 60
        command: |
          set -eo pipefail
          uname -a
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          npm i
          npm test

    - name: Test with IDL ROS messages (rolling)
      if: ${{ matrix.ros_distribution == 'rolling' && matrix.test_suite == 'idl' }}
      uses: nick-fields/retry@v4
      with:
        shell: bash
        max_attempts: 2
        retry_wait_seconds: 10
        timeout_minutes: 60
        command: |
          set -eo pipefail
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          npm i
          npm run test-idl
          npm run clean
