name: ASan

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  asan:
    runs-on: ubuntu-latest
    container:
      # Lyrical Luth is the latest ROS2 LTS and targets Ubuntu 26.04.
      image: ros:lyrical-ros-base-resolute
    steps:
    - name: Setup Node.js 24.X
      uses: actions/setup-node@v7
      with:
        node-version: 24.X
        architecture: x64

    - uses: actions/checkout@v7

    - name: Install build and test dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends \
          cmake sudo \
          ros-lyrical-example-interfaces \
          ros-lyrical-test-msgs \
          ros-lyrical-mrpt-msgs

    - name: Install npm dependencies
      run: |
        source /opt/ros/lyrical/setup.bash
        npm i

    # Wrap the asan test step in nick-fields/retry@v4 to absorb transient
    # flakes. ASan can be sensitive to timing-related test races; keep
    # max_attempts low so real regressions still surface quickly.
    - name: Build and test with AddressSanitizer
      uses: nick-fields/retry@v4
      with:
        shell: bash
        max_attempts: 2
        retry_wait_seconds: 10
        timeout_minutes: 60
        command: |
          set -eo pipefail
          source /opt/ros/lyrical/setup.bash
          npm run test:asan
