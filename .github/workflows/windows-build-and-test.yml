name: Windows Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      trigger_type:
        description: 'Type of trigger (pr or push)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.X]
        ros_distribution:
          - humble
          - jazzy
          - kilted
          - rolling
    steps:
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup ROS2
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: ${{ matrix.ros_distribution }}

    - name: Install pixi and ROS2 dependencies
      if: ${{ matrix.ros_distribution == 'jazzy' }}
      shell: powershell
      run: |
        irm -useb https://pixi.sh/install.ps1 | iex
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","User") + ";" + [System.Environment]::GetEnvironmentVariable("Path","Machine")
        choco install 7zip wget -y
        wget --quiet https://github.com/ros2/ros2/releases/download/release-jazzy-20260128/ros2-jazzy-20260128-windows-release-amd64.zip -O jazzy.zip
        7z x jazzy.zip -y -oC:\pixi_ws\ros2-windows
        irm https://raw.githubusercontent.com/ros2/ros2/refs/heads/jazzy/pixi.toml -OutFile C:\pixi_ws\pixi.toml
        Push-Location C:\pixi_ws
        & "$env:USERPROFILE\.pixi\bin\pixi.exe" install
        Pop-Location

    - name: Prebuild - Setup VS Dev Environment
      uses: seanmiddleditch/gha-setup-vsdevenv@v4

    - uses: actions/checkout@v6

    - name: Build rclnodejs (non-Jazzy)
      if: ${{ matrix.ros_distribution != 'jazzy' }}
      shell: cmd
      run: |
        call "c:\dev\${{ matrix.ros_distribution }}\ros2-windows\setup.bat"
        npm i

    - name: Build rclnodejs (Jazzy)
      if: ${{ matrix.ros_distribution == 'jazzy' }}
      shell: cmd
      run: |
        cd /d C:\pixi_ws
        for /f "tokens=*" %%i in ('%USERPROFILE%\.pixi\bin\pixi.exe shell-hook') do call %%i
        call C:\pixi_ws\ros2-windows\local_setup.bat
        cd /d %GITHUB_WORKSPACE%
        npm i

    - name: Test rclnodejs
      if: ${{ matrix.ros_distribution == 'jazzy' }}
      shell: cmd
      run: |
        cd /d C:\pixi_ws
        for /f "tokens=*" %%i in ('%USERPROFILE%\.pixi\bin\pixi.exe shell-hook') do call %%i
        call C:\pixi_ws\ros2-windows\local_setup.bat
        cd /d %GITHUB_WORKSPACE%
        npm test
