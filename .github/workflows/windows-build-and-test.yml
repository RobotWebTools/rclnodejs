name: Windows

on:
  push:
    branches:
      - develop
      - kilted
      - jazzy
      - humble-hawksbill
  pull_request:
    branches:
      - develop
      - kilted
      - jazzy
      - humble-hawksbill
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - humble
          - jazzy
          - kilted
          - rolling
    steps:
    - name: Setup ROS2
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: ${{ matrix.ros_distribution }}

    - name: Run demo
      shell: cmd
      run: |
        call "c:\dev\${{ matrix.ros_distribution }}\ros2-windows\setup.bat"
        cmd /c "ros2 run demo_nodes_cpp talker"
