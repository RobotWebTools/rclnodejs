name: Windows Pixi Build (Reusable)

on:
  workflow_call:
    inputs:
      trigger_type:
        description: 'Type of trigger (pr or push)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.X]
        ros_distribution:
          - humble
          - jazzy
          - kilted
          - lyrical
          - rolling
        include:
          # Humble Hawksbill (May 2022 - May 2027)
          - ros_distribution: humble
            ros_zip_url: "https://github.com/ros2/ros2/releases/download/release-humble-20260220/ros2-humble-20260220-windows-release-amd64.zip"
            run_tests: false
          - ros_distribution: jazzy
            ros_zip_url: "https://github.com/ros2/ros2/releases/download/release-jazzy-20260128/ros2-jazzy-20260128-windows-release-amd64.zip"
            run_tests: false
          - ros_distribution: kilted
            ros_zip_url: "https://github.com/ros2/ros2/releases/download/release-kilted-20250728/ros2-kilted-20250728-windows-release-amd64.zip"
            run_tests: false
          # Lyrical Luth (May 2026 - May 2031)
          # Reference: https://docs.ros.org/en/lyrical/Installation/Windows-Install-Binary.html
          - ros_distribution: lyrical
            ros_zip_url: "https://github.com/ros2/ros2/releases/download/release-lyrical-20260807/ros2-lyrical-2026-08-07-windows-AMD64.zip"
            run_tests: true
          - ros_distribution: rolling
            ros_zip_url: "https://github.com/ros2/ros2/releases/download/release-rolling-nightlies/ros2-rolling-nightly-windows-amd64.zip"
            run_tests: false
    steps:
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.9.4
      with:
        run-install: false

    - name: Install ROS2 ${{ matrix.ros_distribution }}
      shell: powershell
      run: |
        $ProgressPreference = 'SilentlyContinue'
        choco install 7zip -y
        Invoke-WebRequest -Uri "${{ matrix.ros_zip_url }}" -OutFile ros2.zip
        7z x ros2.zip -y -oC:\pixi_ws
        if (!(Test-Path C:\pixi_ws\ros2-windows\setup.bat)) {
          $setupScript = Get-ChildItem -Path C:\pixi_ws -Recurse -Filter setup.bat | Select-Object -First 1
          if ($null -eq $setupScript) {
            throw "Unable to find ROS 2 setup.bat after extracting ${{ matrix.ros_zip_url }}"
          }
          Move-Item -Path $setupScript.Directory.FullName -Destination C:\pixi_ws\ros2-windows
        }
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/ros2/ros2/refs/heads/${{ matrix.ros_distribution }}/pixi.toml" -OutFile C:\pixi_ws\pixi.toml
        Push-Location C:\pixi_ws
        pixi install
        if (Test-Path C:\pixi_ws\ros2-windows\preinstall_setup_windows.py) {
          Push-Location C:\pixi_ws\ros2-windows
          pixi run python preinstall_setup_windows.py
          Pop-Location
        }
        Pop-Location

    - name: Prebuild - Setup VS Dev Environment
      uses: seanmiddleditch/gha-setup-vsdevenv@v4

    - uses: actions/checkout@v7

    - name: Build rclnodejs
      shell: cmd
      run: |
        set PATH=C:\pixi_ws\.pixi\envs\default\Library\bin;C:\pixi_ws\.pixi\envs\default\Scripts;C:\pixi_ws\.pixi\envs\default\bin;%PATH%
        set RMW_IMPLEMENTATION=rmw_fastrtps_cpp
        call "C:\pixi_ws\ros2-windows\setup.bat"
        npm i

    # Wrap the test step in nick-fields/retry@v4 to absorb transient flakes
    # (mocha races, native rebuilds, network blips). Keep max_attempts low so
    # real regressions still surface quickly.
    - name: Test rclnodejs
      if: ${{ matrix.run_tests }}
      uses: nick-fields/retry@v4
      with:
        shell: cmd
        max_attempts: 2
        retry_wait_seconds: 10
        timeout_minutes: 60
        command: |
          set PATH=C:\pixi_ws\.pixi\envs\default\Library\bin;C:\pixi_ws\.pixi\envs\default\Scripts;C:\pixi_ws\.pixi\envs\default\bin;%PATH%
          set RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          call "C:\pixi_ws\ros2-windows\setup.bat"
          npm test
